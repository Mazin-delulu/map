<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản đồ nghiên cứu sinh vật biển</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body, html { margin:0; padding:0; height:100%; overflow:hidden }
    #map { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1 }
    #sidebar {
      position:fixed; top:0; left:0; width:300px; height:100%;
      background:#f8f9fa; border-right:1px solid #ccc;
      padding:15px; overflow-y:auto; transition:.3s; z-index:1002;
    }
    #sidebar.collapsed { transform:translateX(-100%) }
    #toggleSidebar {
      position:fixed; top:20px; left:10px; width:32px; height:32px;
      background:#0d6efd; color:white; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; user-select:none; transition:.3s; z-index:1100;
    }
    .region-item { margin-bottom:10px; border-bottom:1px solid #ddd; padding-bottom:5px }
    .popup-title { font-weight:bold; color:#1a237e }
    .file-group-title { background:#eef3ff; cursor:pointer; padding:4px 6px; border-radius:6px }
    #subPopup {
      position:fixed; bottom:20px; right:20px; width:340px; display:none;
      max-height:300px; overflow:auto; background:#fff;
      border:1px solid #ddd; border-radius:10px; padding:10px;
      box-shadow:0 6px 18px rgba(0,0,0,0.18); z-index:99999;
    }
  </style>
</head>
<body>

<div id="sidebar" class="collapsed">
  <h2>Vùng nghiên cứu</h2>
  <div id="regionList"></div>
</div>
<div id="toggleSidebar">›</div>
<div id="map"></div>
<div id="subPopup"></div>

<script>
  const map = L.map("map").setView([16.0471,108.2068], 6);
  map.zoomControl.setPosition("topright");
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

  const sidebar=document.getElementById("sidebar"), btn=document.getElementById("toggleSidebar");
  btn.onclick=()=>{
    sidebar.classList.toggle("collapsed");
    const hide=sidebar.classList.contains("collapsed");
    btn.innerHTML=hide?"›":"‹";
    btn.style.left=hide?"10px":"280px";
    setTimeout(()=>map.invalidateSize(),400);
  };

  const popupOverlay=document.getElementById("subPopup");
  function showSubPopup(region,title,files){
    popupOverlay.innerHTML=`<button onclick='hideSub()'>←</button><b>${region} — ${title}</b><br>${files}`;
    popupOverlay.style.display="block";
  }
  function hideSub(){ popupOverlay.style.display="none"; }

  const regionMarkers={}, mainMarkers={};
  const regionList=document.getElementById("regionList");

  Promise.all([
    fetch("data_nghiencuu.json").then(r=>r.json()),
    fetch("data_nghiencuu_new.json").then(r=>r.json())
  ])
  .then(([oldData,newData])=>{
    const data=[...(oldData||[]),...(newData||[])];

    data.forEach(region=>{
      const {region:name,year,links,representative,points}=region;
      const color="#"+Math.floor(Math.random()*16777215).toString(16);

      const centerMarker=L.marker([representative.lat,representative.lon],{
        icon:L.divIcon({
          html:`<svg viewBox="0 0 24 24" fill="${color}" width="32" height="32"><path d="M12 2c-3.87 0-7 3.13-7 7 0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>`,
          className: "custom-marker",
          iconSize: [32, 32],
          iconAnchor: [16, 32],
          popupAnchor: [0, -28]
        })
      }).addTo(map);

      mainMarkers[name]=centerMarker;

      const linksHTML=(links||[]).map((g,i)=>`
        <div class="file-group-title" data-i="${i}">📘 ${g.group_name}</div>`).join("")||"<i>Không có tài liệu</i>";

      centerMarker.bindPopup(`
        <div class="popup-title" style="color:${color}">${name}</div>
        <div>Năm: ${year??"Không rõ"}</div>${linksHTML}
      `);

      centerMarker.on("popupopen",e=>{
        const el=e.popup.getElement();
        el.querySelectorAll(".file-group-title").forEach(div=>{
          div.onclick=()=>{
            const g=links[div.dataset.i];
            const files=g.files.map(f=>`<div><a href="${f.url}" target="_blank">${f.name}</a></div>`).join("");
            showSubPopup(name,g.group_name,files);
          };
        });
      });

      regionMarkers[name]=(points||[]).map(p=>
        L.circleMarker([p.lat,p.lon],{radius:5,color,fillColor:color,fillOpacity:.85})
        .bindPopup(p.name)
      );

      const div=document.createElement("div");
      div.className="region-item";
      div.innerHTML=`<input type="checkbox" data-r="${name}"> <b style="color:${color}">${name}</b> (${year})`;
      regionList.appendChild(div);
    });

    regionList.onchange=e=>{
      const name=e.target.dataset.r;
      if(!name) return;
      const subs=regionMarkers[name]||[];
      const marker=mainMarkers[name];

      if(e.target.checked){
        subs.forEach(m=>m.addTo(map));
        marker.openPopup();
      } else {
        subs.forEach(m=>map.removeLayer(m));
        marker.closePopup();
        hideSub();
      }
    };
  })
  .catch(()=>alert("Lỗi tải JSON"));
</script>
</body>
</html>
